name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCollage-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoCollage.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VideoCollage.apk --title "Video Collage (latest build)" --notes "Built from commit ${GITHUB_SHA::7}. Download VideoCollage.apk below and open it on your phone."
